name: build y pruebas (ROS 2 Humble)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (rosdep)
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
          apt-get install -y python3-transforms3d liburdfdom-tools python3-pytest ros-humble-key-teleop

      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Verificar que los launch y URDF cargan
        run: |
          source install/setup.bash
          xacro src/bumperbot_description/urdf/bumperbot.urdf.xacro > /tmp/sim.urdf
          xacro src/bumperbot_description/urdf/bumperbot.urdf.xacro is_sim:=false > /tmp/real.urdf
          xacro src/bumperbot_description/urdf/bumperbot.urdf.xacro is_sim:=false use_mock_hardware:=true > /tmp/mock.urdf
          check_urdf /tmp/sim.urdf
          check_urdf /tmp/real.urdf
          check_urdf /tmp/mock.urdf
          for f in src/*/launch/*.launch.py; do
            python3 -c "import importlib.util,sys; s=importlib.util.spec_from_file_location('l','$f'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.generate_launch_description()" \
              && echo "OK  $f" || { echo "FALLA $f"; exit 1; }
          done

      - name: Pruebas del gemelo digital (unitarias + dos robots de mentira)
        run: |
          source install/setup.bash
          source ci/annotate.sh
          export ROS_LOCALHOST_ONLY=1
          export TWIN_TEST_REPORT=/tmp/twin_report.txt
          export QT_QPA_PLATFORM=offscreen
          set +e
          python3 -m pytest src/bumperbot_digital_twin/test -v -p no:cacheprovider --durations=10 > /tmp/pytest.log 2>&1
          code=$?
          set -e
          cat /tmp/pytest.log
          annotate notice "Pytest resumen" "$(grep -E 'passed|failed|PASSED|FAILED|ERROR' /tmp/pytest.log | tail -n 40)"
          [ -f /tmp/twin_report.txt ] && annotate notice "Integración con robots de mentira" "$(cat /tmp/twin_report.txt)"
          if [ $code -ne 0 ]; then
            annotate error "Pytest fallos" "$(grep -E '^E |Error|assert' /tmp/pytest.log | head -n 60)"
            for f in /tmp/pytest-of-*/pytest-*/test_*/runner.log /tmp/pytest-of-*/pytest-*/test_*/launch.log; do
              [ -f "$f" ] && annotate warning "$(basename $(dirname $f))/$(basename $f)" "$(grep -iE 'error|exception|traceback|fail|anomal' $f | tail -n 25)"
            done
          fi
          exit $code

      - name: Panel de control (captura sin pantalla)
        if: always()
        run: |
          source install/setup.bash
          QT_QPA_PLATFORM=offscreen ros2 run bumperbot_digital_twin twin_dashboard --selftest /tmp/panel.png

      - name: Robot real con mock hardware + EKF + Nav2 + gemelo
        run: bash ci/test_mock_stack.sh

      - name: Gemelo en Gazebo headless (experimental)
        if: always()
        continue-on-error: true
        timeout-minutes: 18
        run: |
          apt-get install -y libegl1 libgl1-mesa-dri mesa-utils > /dev/null
          bash ci/test_gazebo_twin.sh

rplidar_node:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/rplidar
    serial_baudrate: 115200
    frame_id: laser_link
    inverted: false
    angle_compensate: true
    # Vacío = el modo típico del sensor, que todo A1 tiene. Un modo que el
    # firmware no soporta (p. ej. Sensitivity en un A1M8 viejo) hace que el nodo
    # termine con "Can not start scan". `ros2 run rplidar_ros rplidar_node` lista
    # los modos del tuyo al arrancar.
    scan_mode: ""

# Metas de prueba para la navegación con vista previa en el recinto "arena"
# (world_name:=arena map_name:=arena, paredes en x de -1,0 a 2,0 m e y de -0,5 a 1,5 m:
# 3,0 x 2,0 m por dentro, con la salida a 1 m de la pared de atrás y a 0,5 m de la derecha).
#   ros2 run bumperbot_digital_twin twin_navigate --goals metas_arena
# x, y en metros en el marco del mapa (el origen es la marca de salida); yaw en grados.
goals:
  - {name: N1, x: 1.5, y: 0.0, yaw: 0}
  - {name: N2, x: 1.2, y: 1.0, yaw: 90}
  - {name: N3, x: -0.4, y: 0.8, yaw: 180}
  - {name: N4, x: 0.0, y: 0.0, yaw: 0}
  # Pegada a la pared: el gemelo debe rechazarla (pasa a menos de 20 cm)
  - {name: X1, x: 1.87, y: 0.5, yaw: 0}
  # Fuera del recinto: no hay camino
  - {name: X2, x: 3.0, y: 0.0, yaw: 0}
